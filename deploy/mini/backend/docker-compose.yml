services:
  sierralab-agent-backend:
    container_name: sierralab-agent-backend
    build: .
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Inference stays on whichever machine has the GPU/NPU — not this
      # box. Replace with your own inference host (mDNS hostname or LAN IP).
      OMLX_BASE_URL: "http://your-inference-host.local:8000/v1"
      OMLX_MODEL_ID: "Ternary-Bonsai-27B-mlx-2bit"
      # Qdrant lives on this same box by default (deploy/mini/qdrant/) —
      # reached over its own mDNS hostname, same as any other LAN service
      # here, rather than a Docker-Desktop-specific internal DNS name so
      # this keeps working under podman/Linux too.
      QDRANT_HOST: "sierralab-mini.local"
      QDRANT_PORT: "6333"
      # Frontend and backend are separate containers now, even on the same
      # host, so the frontend's GET /sandbox/_local-token auto-discovery
      # (localhost-only) no longer reaches this container. Set a real
      # secret here — `openssl rand -hex 32` — and the *same* value as
      # SANDBOX_API_TOKEN in deploy/mini/frontend/docker-compose.yml.
      SANDBOX_API_TOKEN: "changeme-generate-with-openssl-rand-hex-32"
    volumes:
      - ./state/sessions:/app/sessions
      - ./state/workspace:/app/workspace
      - ./state/repl_state:/app/repl_state
      - ./state/skills_generated:/app/skills_generated
      - ./state/mcp_servers.json:/app/mcp_servers.json
      - ./state/hf-cache:/root/.cache/huggingface

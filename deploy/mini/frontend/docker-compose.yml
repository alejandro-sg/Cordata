services:
  sierralab-agent-frontend:
    container_name: sierralab-agent-frontend
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # The machine actually running the backend + oMLX model — not this
      # box. Replace with your own backend host (mDNS hostname, LAN IP, or
      # a real domain if you've put a reverse proxy in front of it).
      BACKEND_URL: "http://your-backend-host.local:8001"

# Runs what's actually runnable off this machine: agent/tool construction,
# the denylist/graph-structure/sandbox-token/model-control/proposer-guardrail
# smoke tests (all pure Python, no external service but Qdrant, which the
# `services:` block below provides). The frozen web UI builds in its own
# workflow (frontend.yml), only when frontend/ changes.
#
# Deliberately NOT run here: _acp_smoke_test.py (spawns a real ACP session
# and expects the local oMLX model to actually respond and call tools —
# oMLX is a local Apple Silicon MLX server, nothing to point it at in a
# GitHub-hosted runner) and any live browser check. Those stay manual —
# see README.md for how to run them against a real oMLX instance.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No credentials in the tree or in any commit
        run: |
          python3 scripts/check-secrets.py
          python3 scripts/check-secrets.py --history

  backend:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile-check every backend module
        working-directory: backend
        run: |
          python -c "
          import glob, py_compile
          files = sorted(glob.glob('*.py'))
          for f in files:
              py_compile.compile(f, doraise=True)
          print(f'{len(files)} files compiled OK')
          "

      # settings.py's QDRANT_HOST default (127.0.0.1) already matches how
      # the services: qdrant container above is reachable from this job —
      # no extra env wiring needed for _agent_memory_smoke_test.py or
      # proposer_guardrail's own sandboxed re-run of it.
      - name: Run regression smoke tests
        working-directory: backend
        run: |
          python _subagent_denylist_smoke_test.py
          python _sandbox_token_smoke_test.py
          python _model_control_smoke_test.py
          python _agent_memory_smoke_test.py
          python _proposer_guardrail_smoke_test.py
          # The trajectory export and the Laya checkpoint registry. Hermetic: no model, no
          # network, no eval run (unlike _learning_smoke_test.py, which the gate needs and
          # which loads the local embedding model at import).
          python _trajectories_smoke_test.py
          # The daemon's Discord front door. Hermetic: a fake `discord` module is installed
          # into sys.modules and the real Supervisor drives a scripted ACP child, so this runs
          # with no token, no gateway, no model and no network — it asserts the fail-closed
          # config, the operator allowlist, that an agent *answers* (a chat is a real turn),
          # that approval cards say what/where/why and collapse when decided, and that an
          # agent's words cannot ping anyone.
          python _discord_remote_smoke_test.py
          # The token diet (context_diet.py): cold tools, the tool-result cap, history ageing — through a real
          # Strands loop on a scripted model; the SDK features adopted for it (ContextOffloader, per-turn limits,
          # native cancel, proactive compression). No model, no network.
          python _context_diet_smoke_test.py
          python _offload_acp_smoke_test.py
          # The SDK's vended shell and editor (core_tools.py): exit codes in text, defaults, a stop that kills the command.
          python _core_tools_smoke_test.py
          # Conversations on disk: snapshot sessions and the migration from the legacy layout (session_store.py).
          python _session_store_smoke_test.py
          python _diet_acp_smoke_test.py
          python _skill_search_smoke_test.py
          # The daemon (second front doors, owned sessions), the observer (no model call on an unchanged tree)
          # and the guard's `dd` rule; all hermetic.
          python _daemon_smoke_test.py
          python _observer_smoke_test.py
          python _laya_call_guard_smoke_test.py
          python _settings_schema_parity_smoke_test.py
          # The ten backend defects a native front door hits first (docs/app.md B0): busy guard, daemon ids, the sessions
          # table and its lease, a cancel during a goal, a cancelled run, the turn diff, stranded approvals, the schema.
          python _backend_hardening_smoke_test.py
          # The session surface a native front door reads (B1): ACP plan and usage, replay with tool calls, history pages,
          # forks, mode/config echo, attached images.
          python _session_surface_smoke_test.py
          # Orchestrator runs a front door can steer (B2): detached runs, pause/resume/cancel at safe points, per-pod
          # events and usage, bounded artifact reads, the daemon's run endpoints.
          python _orchestrator_control_smoke_test.py
          # The daemon's surface for the app (B3): daemon.json written atomically, /projects with worktrees, /history,
          # the read-only observer role, approval options over gRPC.
          python _daemon_surface_smoke_test.py
          # Settings and trust through the server (B4): app.* user-only, settings/*, trust cards, auto readiness, and
          # auto/edit confirmations from clients that promise to ask.
          python _settings_trust_smoke_test.py
          # The editor surface for the app (P3): trust-gated diagnostics on unsaved text, confinement, lsp/status.
          python _editor_surface_smoke_test.py
          # Phase 11/12 (system_audit_report.md): the audit's security and memory fixes, code navigation (search,
          # outlines, the large-file hook), preflight (edits checked before anyone is asked), rejection memory, and
          # environment awareness (MCP discovery and resources, the profiler, adaptive effort). Hermetic: scripted
          # models, a fake oMLX, the echo MCP fixture; the rust-analyzer check skips where it is not installed.
          python _phase11_hardening_smoke_test.py
          python _code_nav_smoke_test.py
          python _preflight_smoke_test.py
          python _rejection_memory_smoke_test.py
          python _environment_awareness_smoke_test.py
          # Phase 13, the menu-bar deck's screen context: the never-read list held equal to the Rust client's, the
          # wrapped + masked block, `SubmitTurn` on a real loopback bridge (policy re-check, audit, log line), and a
          # screenshot turn through the real ACP server on a mock-transport Ollama model (vision tag, image gone after).
          # The orchestrator's Worker interface (docs/orchestrator-plan.md, phase 1): every adapter against a scripted
          # provider. Off macOS the two CLI adapters are skipped (they refuse to run without Seatbelt); Ollama's run.
          python _worker_conformance_smoke_test.py
          # Phase 2: the quota ledger (windows, soft/hard lines, provider signals, the envelope) and safe-point handoffs —
          # a provider limit injected at step 2 of 5, rolled back, handed off, resumed elsewhere, the project's tests pass.
          python _quota_ledger_smoke_test.py
          # Phase 3: the plan contract and the plan → execute → harden → audit machine — accept, planted drift caught
          # and fixed, Tier-2 verdicts, an unreported scope escape, bounded retries then restore, pause and resume.
          python _orchestrator_machine_smoke_test.py
          # Phases 4–5: the dispatch policy (gates before scores; cheapest competent tier, judged in two simulated worlds
          # and by replay) and the orchestration eval suite with its promotion gate.
          python _dispatch_smoke_test.py
          python _orchestration_eval_smoke_test.py
          python _os_context_smoke_test.py
          python _grpc_bridge_smoke_test.py
          python _vision_turn_smoke_test.py

  # The Rust clients: the terminal (tui/) and the native app (app/), which share cordata-view and cordata-theme.
  # macOS runners: the app is Metal/AppKit (GPUI builds with the Command Line Tools' runtime shaders).
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tui
            app
      - name: Terminal (acp-core, acp-tui, acp-stress)
        working-directory: tui
        run: cargo test --workspace
      - name: Shared state, palette and app (headless)
        working-directory: app
        run: cargo test --workspace --features cordata-view/crossterm
      - name: Clippy (app)
        working-directory: app
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Supply chain (licences, bans, sources, advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: app/Cargo.toml
      - name: gpui-pre is zed@93d7456
        run: app/scripts/verify-gpui-snapshot.sh

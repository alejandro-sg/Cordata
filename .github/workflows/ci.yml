# The secrets scan, then the Rust clients: the terminal (tui/) and the native app (app/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No credentials in the tree or in any commit
        run: |
          cd tui
          cargo run -q -p cordata-guard --bin cordata-secrets
          cargo run -q -p cordata-guard --bin cordata-secrets -- --history

  # cargo-deny's action is a container action, which GitHub runs on Linux only.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supply chain (licences, bans, sources, advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: app/Cargo.toml

  # The Rust clients: the terminal (tui/) and the native app (app/), which share cordata-view and cordata-theme.
  # macOS runners: the app is Metal/AppKit (GPUI builds with the Command Line Tools' runtime shaders).
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tui
            app
      - name: Terminal (acp-core, acp-tui, orchestrator and tools)
        working-directory: tui
        run: cargo test --workspace
      - name: Clippy (terminal)
        working-directory: tui
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Shared state, palette and app (headless)
        working-directory: app
        run: cargo test --workspace --features cordata-view/crossterm
      - name: Clippy (app)
        working-directory: app
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: gpui-pre is zed@93d7456
        run: app/scripts/verify-gpui-snapshot.sh

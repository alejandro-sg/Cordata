<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Soft ambient drop shadow underneath squircle -->
    <filter id="ambient-shadow-light" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="36" stdDeviation="38" flood-color="#0F172A" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>

    <!-- Crystal frosted glass base gradient -->
    <linearGradient id="light-glass-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F6F8FA"/>
      <stop offset="75%" stop-color="#EAEFF4"/>
      <stop offset="100%" stop-color="#DBE2EB"/>
    </linearGradient>

    <!-- Top glass specular highlight rim -->
    <linearGradient id="specular-rim-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Secondary inner bevel stroke -->
    <linearGradient id="inner-bevel-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Top-left smooth glass surface sheen -->
    <radialGradient id="glass-sheen-light" cx="30%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Bottom viridian refraction tint -->
    <radialGradient id="caustic-bounce-light" cx="50%" cy="92%" r="55%">
      <stop offset="0%" stop-color="#0A6553" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#0A6553" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0A6553" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Mark ring gradient -->
    <linearGradient id="ring-gradient-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1F26"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>

    <!-- Mark cell gradient -->
    <linearGradient id="cell-gradient-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#109B7A"/>
      <stop offset="100%" stop-color="#075645"/>
    </linearGradient>

    <!-- Clean mark drop shadow on whole emblem -->
    <filter id="emblem-shadow-light" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="squircle-clip-light">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Ambient shadow behind squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#DBE2EB" filter="url(#ambient-shadow-light)"/>

  <!-- Glass Plate Content -->
  <g clip-path="url(#squircle-clip-light)">
    <!-- Base crystal frosted glass -->
    <rect x="100" y="100" width="824" height="824" fill="url(#light-glass-base)"/>

    <!-- Bottom viridian refraction tint -->
    <rect x="100" y="100" width="824" height="824" fill="url(#caustic-bounce-light)"/>

    <!-- Top-left smooth glass surface sheen -->
    <rect x="100" y="100" width="824" height="824" fill="url(#glass-sheen-light)"/>

    <!-- Emblem floating in glass -->
    <g transform="translate(241.1 236.8) scale(8.6)" filter="url(#emblem-shadow-light)">
      <!-- Ring -->
      <path d="M45 7.201A28 28 0 1 0 45 56.799V45.856A19 19 0 1 1 45 18.144Z" fill="url(#ring-gradient-light)"/>
      <!-- Cursor Cell -->
      <path d="M49 20h10v24H49Z" fill="url(#cell-gradient-light)"/>
    </g>

    <!-- Inner bevel stroke -->
    <rect x="102" y="102" width="820" height="820" rx="183" stroke="url(#inner-bevel-light)" stroke-width="3" fill="none"/>

    <!-- Top specular liquid glass highlight rim -->
    <rect x="101" y="101" width="822" height="822" rx="184" stroke="url(#specular-rim-light)" stroke-width="4.5" fill="none"/>
  </g>

  <!-- Outer hairline boundary -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" fill="none"/>
</svg>
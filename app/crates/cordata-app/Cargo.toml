[package]
name = "cordata-app"
description = "Cordata.app — the native macOS workspace for the Cordata agent harness and its orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cordata-app"
path = "src/main.rs"

[dependencies]
acp-core.workspace = true
cordata-view.workspace = true
cordata-theme.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# The languages a coding agent's projects are written in — not all 35 grammars (each is a C library and a licence).
gpui-component = { workspace = true, features = ["tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-make", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-sql", "tree-sitter-swift", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml"] }
gpui-fps.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
# The window's own preferences file (prefs.toml in Application Support).
toml = "0.8"
# Images attached to a prompt go out base64-encoded (ACP image blocks).
base64 = "0.22"
# The editor's completion types (the same version gpui-component uses).
lsp-types = "=0.97.0"
tokio.workspace = true
# The control socket's peer check (getpeereid) and the terminal's foreground process (tcgetpgrp, sysctl).
libc = "0.2"
# Agent detection rules (detect.toml).
regex = "1"
# The Lucide icons the chrome uses, embedded (only those listed in main.rs); the version gpui-component ships with.
gpui-kit-assets = "=0.7.3"
# The dock terminal's emulator and PTY (the one Zed's GPUI terminal uses): pure Rust, Apache-2.0.
alacritty_terminal = { version = "=0.26.0", default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSAccessibility", "NSAppearance", "NSApplication", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSSound", "NSView", "NSWindow", "NSWorkspace", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSButton", "NSControl", "NSCell", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry", "NSString", "NSObject"] }
# Native notifications under the app's own name and icon (macOS shows `osascript` banners as "Script Editor"). Already in the
# lockfile through GPUI; block2 carries the completion handlers.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }
block2 = "0.6"
raw-window-handle = "0.6"
# The API key lives in the login Keychain only (the backend reads the same item at start).
security-framework = "3"

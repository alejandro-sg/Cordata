[package]
name = "cordata-view"
description = "Cordata's front-end state (conversation reducer, commands, input, settings), shared by the terminal and the native app"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

# Versions are written out rather than inherited: acp-tui builds this crate as a path dependency from the tui/
# workspace, and they must agree with that workspace's (agent-client-protocol stack, serde_json preserve_order).
[dependencies]
acp-core = { path = "../../../tui/crates/acp-core" }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync"] }
crossterm = { version = "0.29", optional = true, default-features = false, features = ["events"] }

[features]
# `From` conversions for the terminal's events.
crossterm = ["dep:crossterm"]

[dev-dependencies]
tempfile = "3"

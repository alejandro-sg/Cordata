[package]
name = "harness-capture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "What the person allowed the harness to see: OS context capture, deny-by-default"

[lib]
name = "harness_capture"
path = "src/lib.rs"

[dependencies]
harness-client = { workspace = true }
harness-proto = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
accessibility-sys = "0.1"
# Already in the tree through `accessibility-sys`: used for the CFString reads and their ownership
# rules rather than pulling a wrapper crate in front of them.
core-foundation-sys = "0.8"
# The window screenshot (`screenshot.rs`): ScreenCaptureKit, because `CGWindowListCreateImage` is
# obsoleted from macOS 15 on. Bindings at the objc2 versions gpui already pulls in.
objc2-foundation = { workspace = true, features = ["NSArray", "NSEnumerator", "NSError"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-graphics", "objc2-core-foundation", "SCScreenshotManager", "SCShareableContent", "SCStream"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
block2 = "0.6"


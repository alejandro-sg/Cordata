[workspace]
resolver = "3"
members = ["crates/harness-proto", "crates/harness-client", "crates/harness-observer", "crates/harness-lab"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# gRPC. tonic 0.14 split its prost codec into `tonic-prost`; versions move together.
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
# `protoc` shipped as a crate, so building this needs no system protobuf (build.rs falls back to it).
protoc-bin-vendored = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
tempfile = "3"
sha2 = "0.10"
# The proactive observer. `notify` 8 (9 is still a release candidate).
notify = "8"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
# Zed's GPU UI framework. `runtime_shaders` compiles the Metal shaders when the app starts, so
# building needs the Command Line Tools only — not a full Xcode with the Metal toolchain.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
harness-proto = { path = "crates/harness-proto" }
harness-client = { path = "crates/harness-client" }
harness-observer = { path = "crates/harness-observer" }

[profile.dev]
# The UI crates are unusably slow unoptimised (GPUI scenes, tree-sitter); keep our own code
# debuggable and the dependencies fast.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

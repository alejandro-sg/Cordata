[workspace]
resolver = "3"
members = ["crates/acp-core", "crates/acp-tui", "crates/acp-stress"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# Pinned exactly: the high-level client API (Client.builder().connect_with,
# ActiveSession) is what acp-core is written against. Default features only —
# acp_server.py speaks none of the unstable_* extensions.
agent-client-protocol = "=2.2.0"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"
thiserror = "2"
unicode-width = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal"] }
acp-core = { path = "crates/acp-core" }

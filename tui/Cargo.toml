[workspace]
resolver = "3"
members = ["crates/acp-core", "crates/acp-tui", "crates/acp-stress", "crates/cordata-ledger", "crates/cordata-doctor", "crates/cordata-orchestrator"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# Pinned exactly: the high-level client API (Client.builder().connect_with,
# ActiveSession) is what acp-core is written against. Default features only —
# acp_server.py speaks none of the unstable_* extensions.
agent-client-protocol = "=2.2.0"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
textwrap = "0.16"
# The daemon's transport. Default features only (connect + handshake): wss
# would pull a TLS stack this never uses, since daemon/server.py binds loopback.
tokio-tungstenite = "0.28"
# Native in-process provider adapter (Anthropic, Gemini, OpenAI, Ollama) for acp-core's `native` module.
# SQLite for the quota ledger (~/.cordata/state.db). Bundled: the file is shared with the Python backend, and a
# system libsqlite of unknown version must not decide whether WAL and the schema behave the same on both sides.
rusqlite = { version = "0.37", features = ["bundled"] }
# Process-group kill for the subprocess workers.
libc = "0.2"
# JSON Schema validation of a worker's structured answer (plan / audit roles).
jsonschema = { version = "0.30", default-features = false }
genai = "0.7"
# Gitignore-aware directory walk for the native `code_search` tool.
ignore = "0.4"
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"
vt100 = "0.16"
# "net" is for the WebSocket client transport (crates/acp-core/src/transport.rs);
# stdio-only builds do not need it, but feature-gating one dependency to save a
# compile is not worth two build configurations to keep correct.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal", "net", "process"] }
acp-core = { path = "crates/acp-core" }
# The front-end state shared with the native app (app/crates/cordata-view); `crossterm` adds the event conversions.
cordata-view = { path = "../app/crates/cordata-view", features = ["crossterm"] }
# The colour roles, shared with the native app (app/crates/cordata-theme).
cordata-theme = { path = "../app/crates/cordata-theme" }

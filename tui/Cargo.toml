[workspace]
resolver = "3"
members = ["crates/acp-core", "crates/acp-tui", "crates/cordata-ledger", "crates/cordata-doctor", "crates/cordata-orchestrator", "crates/cordata-checkpoints", "crates/cordata-run", "crates/cordata-guard", "crates/cordata-economizer", "crates/cordata-floorplan", "crates/cordata-bus", "crates/cordata-repomap"]

[workspace.package]
edition = "2024"
version = "0.4.0"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
# Fast in-memory digests for the economizer loop guard (fixed seeds; never persisted).
ahash = "0.8"
textwrap = "0.16"
# Native in-process provider adapter (Anthropic, Gemini, OpenAI, Ollama) for acp-core's `native` module.
# SQLite for the quota ledger (~/.cordata/state.db). Bundled, so the system libsqlite's version cannot change how WAL
# and the schema behave.
rusqlite = { version = "0.37", features = ["bundled"] }
# Process-group kill for the subprocess workers.
libc = "0.2"
# The SYNTHESIZE check: syntax of Python (tree-sitter), JSON, TOML and YAML files, and imports between project modules.
tree-sitter = "0.26"
tree-sitter-python = "0.25"
# The repo map (crates/cordata-repomap): definitions and references for Rust, TypeScript/JavaScript and Go too.
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
# Optional semantic layer of the repo map: static Model2Vec embeddings, loaded from a local folder only (no hub client).
model2vec-rs = { version = "0.4", default-features = false, features = ["fancy-regex", "local-only"] }
toml = "0.8"
serde_yaml = "0.9"
# Checkpoint store keys: the shadow repository directory is the first 16 hex chars of the project path's SHA-1.
sha1 = "0.10"
# Pins an approved project MCP server to its exact command, arguments and environment.
sha2 = "0.10"
# JSON Schema validation of a worker's structured answer (plan / audit roles).
jsonschema = { version = "0.30", default-features = false }
genai = "0.7"
# Gitignore-aware directory walk for the native `code_search` tool.
ignore = "0.4"
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"
vt100 = "0.16"
# "net" is for the WebSocket client transport (crates/acp-core/src/transport.rs);
# stdio-only builds do not need it, but feature-gating one dependency to save a
# compile is not worth two build configurations to keep correct.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal", "net", "process"] }
acp-core = { path = "crates/acp-core" }
# The front-end state shared with the native app (app/crates/cordata-view); `crossterm` adds the event conversions.
cordata-view = { path = "../app/crates/cordata-view", features = ["crossterm"] }
# The colour roles, shared with the native app (app/crates/cordata-theme).
cordata-theme = { path = "../app/crates/cordata-theme" }
